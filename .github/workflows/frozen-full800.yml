name: Frozen Full800 CPU checks
on:
  push:
    branches:
      - releases/official100-gd10-b26-k800-20261008
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r reproduction/requirements-backend.txt
      - run: python tools/run_frozen_full800.py verify
      - run: python -m pytest -q tests/test_frozen_full800_release.py tests/test_fi1_r0_r1_protocol.py tests/test_fi1_r2_core.py tests/test_fi1_r3_core.py
